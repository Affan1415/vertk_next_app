# Blocks the config-file malware that keeps being re-injected into
# postcss.config.mjs (see SECURITY-INCIDENT.md). The scan only greps file
# text — it never loads a config — so it is safe to run on untrusted code.
# Make this a required status check on main (Settings → Branches).
name: config injection scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-injection.sh
